name: Score PR - Python

# ⚠️  SECURITY WARNING: This workflow uses pull_request_target
# This runs with access to LEADERBOARD_TOKEN secret in the original repo's context.
# This is safe ONLY because:
# 1. We do NOT install fork dependencies (npm install, pip install, etc.)
# 2. We do NOT execute fork code (scripts, setup.py, build files)
# 3. We only run static analysis tools on manifests (npm audit, pip-audit, dependency-check)
# 4. We only read fork files, never execute them
#
# DO NOT change this workflow to:
# - Run npm install / pip install / mvn build from the fork
# - Execute scripts from the fork
# - Run arbitrary commands with fork inputs
# This would allow malicious PRs to steal LEADERBOARD_TOKEN.

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request_target:
    types: [opened, synchronize]
    branches:
      - main
      - participant-start

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original repo
        uses: actions/checkout@v4
        with:
          path: original

      - name: Parse baseline from SCAN-RESULTS.md
        id: baseline
        run: |
          cd original
          baseline=$(python3 scripts/parse-baseline.py SCAN-RESULTS.md)
          echo "count=$baseline" >> $GITHUB_OUTPUT
          echo "📊 Baseline: $baseline vulnerabilities"

      - name: Checkout PR fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          path: fork

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on fork
        id: audit
        run: |
          cd fork
          if [ ! -f requirements.txt ]; then
            echo "❌ requirements.txt not found in fork"
            exit 1
          fi
          pip-audit -r requirements.txt --format json > audit-report.json
          if [ ! -s audit-report.json ]; then
            echo "❌ pip-audit produced empty output"
            exit 1
          fi

      - name: Parse current vulnerabilities
        id: current
        run: |
          cd fork
          python3 << 'EOF'
          import json
          import os

          try:
              with open('audit-report.json', 'r') as f:
                  content = f.read().strip()
                  if not content:
                      raise ValueError("Empty audit report")
                  data = json.loads(content)
          except Exception as e:
              print(f"Error reading audit report: {e}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("count=0\n")
              exit(1)

          vulnerabilities = data.get('vulnerabilities', [])

          critical = 0
          high = 0

          for vuln in vulnerabilities:
              severity = vuln.get('vulnerability', {}).get('severity', 'unknown').lower()
              if severity == 'critical':
                  critical += 1
              elif severity == 'high':
                  high += 1

          current_count = critical + high

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"count={current_count}\n")
          print(f"Current: {current_count} vulnerabilities")
          EOF

      - name: Calculate score
        id: score
        run: |
          baseline=${{ steps.baseline.outputs.count }}
          current=${{ steps.current.outputs.count }}
          score=$((baseline - current))
          echo "score=$score" >> $GITHUB_OUTPUT
          echo "📈 Score: $score vulnerabilities fixed"

      - name: Get current timestamp
        id: timestamp
        run: |
          ts=$(date -u +'%Y-%m-%dT%H:%M:%S.%N' | sed 's/[0-9]\{6\}Z$/Z/')Z
          echo "ts=$ts" >> $GITHUB_OUTPUT

      - name: Debug - Check token availability
        env:
          LEADERBOARD_TOKEN: ${{ secrets.LEADERBOARD_TOKEN }}
        run: |
          if [ -z "$LEADERBOARD_TOKEN" ]; then
            echo "❌ LEADERBOARD_TOKEN is empty or not set"
            exit 1
          else
            TOKEN_LENGTH=${#LEADERBOARD_TOKEN}
            echo "✅ LEADERBOARD_TOKEN is available (length: $TOKEN_LENGTH chars)"
            echo "First 10 chars: ${LEADERBOARD_TOKEN:0:10}..."
          fi

      - name: Push to leaderboard
        env:
          LEADERBOARD_TOKEN: ${{ secrets.LEADERBOARD_TOKEN }}
        run: |
          cd original
          python3 scripts/score-and-leaderboard.py \
            --repo-name verademo-python \
            --username "${{ github.event.pull_request.user.login }}" \
            --baseline-count ${{ steps.baseline.outputs.count }} \
            --current-count ${{ steps.current.outputs.count }} \
            --timestamp "${{ steps.timestamp.outputs.ts }}" \
            --leaderboard-repo veracode-wad26/leaderboard \
            --github-token "$LEADERBOARD_TOKEN"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const baseline = ${{ steps.baseline.outputs.count }};
            const current = ${{ steps.current.outputs.count }};
            const score = ${{ steps.score.outputs.score }};
            const timestamp = "${{ steps.timestamp.outputs.ts }}";

            let status = '❌';
            if (current === 0) status = '✅';
            else if (score > 0) status = '🟡';

            let body = status + ' **Scoring Update**\n\n';
            body += '| Metric | Value |\n';
            body += '|--------|-------|\n';
            body += '| Baseline | ' + baseline + ' vulnerabilities |\n';
            body += '| Current | ' + current + ' vulnerabilities |\n';
            body += '| Fixed | ' + score + ' vulnerabilities |\n';
            body += '| Timestamp | ' + timestamp + ' |\n\n';
            body += 'Run `pip-audit -r requirements.txt` locally to see details.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
