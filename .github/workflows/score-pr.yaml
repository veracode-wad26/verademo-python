name: Score PR - Python

# ⚠️  SECURITY WARNING: This workflow uses pull_request_target
# This runs with access to LEADERBOARD_TOKEN secret in the original repo's context.
# This is safe ONLY because:
# 1. We do NOT install fork dependencies (pip install, etc.)
# 2. We do NOT execute fork code (scripts, setup.py, build files)
# 3. We only run static analysis tools on manifests
# 4. We only read fork files, never execute them
#
# DO NOT change this workflow to:
# - Run pip install from the fork
# - Execute scripts from the fork
# - Run arbitrary commands with fork inputs
# This would allow malicious PRs to steal LEADERBOARD_TOKEN.

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request_target:
    types: [opened, synchronize]
    branches:
      - main
      - participant-start

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original repo
        uses: actions/checkout@v4
        with:
          path: original

      - name: Parse baseline from osv-scanner-baseline.json
        id: baseline
        run: |
          cd original
          baseline=$(python3 scripts/parse-baseline.py osv-scanner-baseline.json)
          echo "count=$baseline" >> $GITHUB_OUTPUT
          echo "📊 Baseline: $baseline vulnerabilities"

      - name: Checkout PR fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          path: fork

      - name: Install osv-scanner
        run: |
          mkdir -p /tmp/osv-bin
          curl -sL https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64 -o /tmp/osv-bin/osv-scanner
          chmod +x /tmp/osv-bin/osv-scanner
          echo "/tmp/osv-bin" >> $GITHUB_PATH

      - name: Verify osv-scanner installation
        run: |
          osv-scanner --version
          which osv-scanner
          echo "✅ osv-scanner is available in PATH"

      - name: Validate requirements.txt exists
        run: |
          if [ ! -f fork/requirements.txt ]; then
            echo "❌ requirements.txt not found in fork"
            exit 1
          fi

      - name: Run osv-scanner on fork
        run: |
          cd fork
          echo "📦 Scanning fork..."
          osv-scanner scan -r -f json --output-file audit-report.json . 2>&1 || true

      - name: Parse current vulnerabilities
        id: current
        run: |
          count=$(cd original && python3 scripts/parse-current.py ../fork/audit-report.json)
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Current: $count vulnerabilities (CRITICAL + HIGH)"

      - name: Calculate score
        id: score
        run: |
          baseline=${{ steps.baseline.outputs.count }}
          current=${{ steps.current.outputs.count }}
          score=$((baseline - current))
          echo "score=$score" >> $GITHUB_OUTPUT
          echo "📈 Score: $score vulnerabilities fixed"

      - name: Get current timestamp
        id: timestamp
        run: |
          ts=$(date -u +'%Y-%m-%dT%H:%M:%S.%N' | sed 's/[0-9]\{6\}Z$/Z/')Z
          echo "ts=$ts" >> $GITHUB_OUTPUT

      - name: Debug - Check token availability
        env:
          LEADERBOARD_TOKEN: ${{ secrets.LEADERBOARD_TOKEN }}
        run: |
          if [ -z "$LEADERBOARD_TOKEN" ]; then
            echo "❌ LEADERBOARD_TOKEN is empty or not set"
            exit 1
          else
            TOKEN_LENGTH=${#LEADERBOARD_TOKEN}
            echo "✅ LEADERBOARD_TOKEN is available (length: $TOKEN_LENGTH chars)"
            echo "First 10 chars: ${LEADERBOARD_TOKEN:0:10}..."
          fi

      - name: Push to leaderboard
        env:
          LEADERBOARD_TOKEN: ${{ secrets.LEADERBOARD_TOKEN }}
        run: |
          cd original
          python3 scripts/score-and-leaderboard.py \
            --repo-name verademo-python \
            --username "${{ github.event.pull_request.user.login }}" \
            --baseline-count ${{ steps.baseline.outputs.count }} \
            --current-count ${{ steps.current.outputs.count }} \
            --timestamp "${{ steps.timestamp.outputs.ts }}" \
            --leaderboard-repo veracode-wad26/leaderboard \
            --github-token "$LEADERBOARD_TOKEN"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd original
          python3 scripts/post-pr-comment.py \
            --baseline ${{ steps.baseline.outputs.count }} \
            --current ${{ steps.current.outputs.count }} \
            --score ${{ steps.score.outputs.score }} \
            --timestamp "${{ steps.timestamp.outputs.ts }}" \
            --scanner requirements.txt

      - name: Fail check if vulnerabilities remain
        if: ${{ steps.current.outputs.count > 0 }}
        run: |
          echo "❌ PR still has ${{ steps.current.outputs.count }} vulnerabilities remaining"
          exit 1
